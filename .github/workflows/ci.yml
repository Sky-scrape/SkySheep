name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # 手动触发：跑发布候选门禁（冻结包构建 + 隔离冒烟 + 安装包编译）
  workflow_dispatch:
    inputs:
      package:
        description: "构建发布候选（PyInstaller 冻结包 + 安装包）"
        type: boolean
        default: true

# 套件约 6 分钟：同一分支连续 push 时取消还在跑的旧一轮，不再排队全跑
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint & test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 发布清单 §1「版本号一致」的机械化：pyproject / __init__ / installer.iss /
      # CHANGELOG 最新发布条目 / README 路线图当前版本，任一处漂移直接红。
      # 脚本按 __file__ 定位仓库根、不依赖 cwd，从检出根带 engine/ 前缀直接跑
      - name: Check version consistency
        run: python engine/tools/check_versions.py

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      # --locked：改了 pyproject 忘更 uv.lock 时在这里直接红，而不是静默重算 lock 掩盖漂移
      - name: Sync dependencies
        working-directory: engine
        run: uv sync --locked

      - name: Ruff check
        working-directory: engine
        run: uv run ruff check .

      # 每次提交只跑非 e2e 套件并输出覆盖率（门槛略低于当前基线 81%，2026-09-25 审查上调，
      # 防止明显回归；有意提升覆盖时同步上调）。
      - name: Pytest (unit, with coverage)
        working-directory: engine
        run: uv run pytest -m "not e2e and not eval" -q --cov=skysheep --cov-report=term-missing:skip-covered --cov-fail-under=80.5

  e2e:
    name: e2e (real socket)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        working-directory: engine
        run: uv sync --locked

      # 真实 uvicorn + socket 的端到端单独一层：与单测解耦，互不阻塞
      - name: Pytest (e2e)
        working-directory: engine
        run: uv run pytest -m e2e -q

  # 真实浏览器 UI 交互（Playwright）：前端零构建、无 Node 工具链，键盘操作、
  # 焦点、视口缩放、窄屏无溢出这些真实渲染行为此前只能手动验。playwright 放在
  # 独立的 browser 依赖组（不进 dev）——单测与 e2e 两个 job 的 uv sync --locked
  # 不拉它，这里显式 --group browser 装、并缓存 Chromium 二进制，让这组用例真正
  # 在 CI 跑起来而不是整组跳过。
  ui:
    name: browser UI (playwright)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies (browser group)
        working-directory: engine
        run: uv sync --locked --group browser

      # Chromium 约 150MB：按 uv.lock 做键缓存，命中就不重下；restore-keys 让
      # 依赖变动时先复用旧缓存再增量补
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('engine/uv.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium
        working-directory: engine
        run: uv run --group browser python -m playwright install chromium

      # 显式点名文件：这组用例带 e2e + slow 标记，靠路径选定而非 -m 选择器。
      # uv run 也带 --group browser：不让隐式同步语义决定 playwright 在不在。
      - name: Pytest (browser UI)
        working-directory: engine
        run: uv run --group browser pytest tests/test_browser_ui.py -q

  # 依赖漏洞扫描：从 uv.lock 导出全部运行时依赖（不含 dev 组、不含本包）交 pip-audit 审。
  # 跑 windows-latest 与本地核验环境一致（lock 是全平台通用锁，pywinpty/pywin32 等
  # Windows 专属依赖在别的平台装不出来）；不改 pyproject.toml / uv.lock，导出是纯读。
  audit:
    name: pip-audit (locked deps)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      # --no-emit-project：本包 skysheep-engine 不在 PyPI 上，带着 -e . 时
      # pip-audit --strict 必红（本地实测：skysheep-engine: Dependency not found on PyPI）
      - name: Export locked deps (runtime only)
        working-directory: engine
        run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements-audit.txt

      # --strict：任何已知漏洞照常红。CVE-2026-101918（pyjwt < 2.15.0，经 mcp 传入的
      # 传递依赖）在引入本 job 时锁文件里还没有修复版本，曾定点 ignore；
      # 已于 2026-10-01 升级到修复版 pyjwt 2.15.1（uv lock --upgrade-package pyjwt）解除。
      - name: pip-audit
        working-directory: engine
        run: uvx pip-audit -r requirements-audit.txt --strict

  # 发布候选门禁：把「冻结包能不能构建、能不能在隔离 SKYSHEEP_HOME 下起来、
  # 安装包能不能编译」变成 CI 里的可复现证据，而不是只靠本地 release.py。
  # 默认只在手动触发或打 tag 时跑（每次 push 都跑会把 CI 时长拉长一倍以上）。
  package:
    name: release candidate (freeze + installer)
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        working-directory: engine
        run: uv sync --locked

      # 不经 uv run：PyInstaller 与冒烟直接用 .venv 里的可执行文件（见 AGENTS.md）
      - name: Build frozen app (PyInstaller)
        working-directory: engine
        run: .venv\Scripts\pyinstaller.exe --noconfirm --clean SkySheep.spec

      # 隔离 SKYSHEEP_HOME 下起冻结包，GET / 应 200（沿用 release.py 的冒烟口径）
      - name: Smoke frozen app (isolated home)
        working-directory: engine
        shell: pwsh
        run: |
          $home = Join-Path $env:RUNNER_TEMP "skysheep-ci-home"
          New-Item -ItemType Directory -Force -Path $home | Out-Null
          $env:SKYSHEEP_HOME = $home
          $proc = Start-Process -FilePath "dist\SkySheep\SkySheep.exe" `
            -ArgumentList "--browser","--port","8791" -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8791/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { taskkill /PID $proc.Id /T /F; throw "冻结包冒烟失败：GET / 未返回 200" }
          taskkill /PID $proc.Id /T /F | Out-Null

      # 安装包编译：本机 ISCC 装在非默认路径，CI 上装 Inno Setup 后按默认路径调用
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (ISCC)
        working-directory: engine
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" tools\installer.iss
        shell: pwsh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skysheep-release-candidate
          path: |
            engine/dist/SkySheep/SkySheep.exe
            engine/installer/*.exe
          if-no-files-found: error
          retention-days: 14
