name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 套件约 6 分钟：同一分支连续 push 时取消还在跑的旧一轮，不再排队全跑
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint & test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 发布清单 §1「版本号一致」的机械化：pyproject / __init__ / installer.iss /
      # CHANGELOG 最新发布条目 / README 路线图当前版本，任一处漂移直接红。
      # 脚本按 __file__ 定位仓库根、不依赖 cwd，从检出根带 engine/ 前缀直接跑
      - name: Check version consistency
        run: python engine/tools/check_versions.py

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      # --locked：改了 pyproject 忘更 uv.lock 时在这里直接红，而不是静默重算 lock 掩盖漂移
      - name: Sync dependencies
        working-directory: engine
        run: uv sync --locked

      - name: Ruff check
        working-directory: engine
        run: uv run ruff check .

      # 每次提交只跑非 e2e 套件并输出覆盖率（门槛略低于当前基线 81%，2026-09-25 审查上调，
      # 防止明显回归；有意提升覆盖时同步上调）。
      - name: Pytest (unit, with coverage)
        working-directory: engine
        run: uv run pytest -m "not e2e and not eval" -q --cov=skysheep --cov-report=term-missing:skip-covered --cov-fail-under=80.5

  e2e:
    name: e2e (real socket)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        working-directory: engine
        run: uv sync --locked

      # 真实 uvicorn + socket 的端到端单独一层：与单测解耦，互不阻塞
      - name: Pytest (e2e)
        working-directory: engine
        run: uv run pytest -m e2e -q

  # 依赖漏洞扫描：从 uv.lock 导出全部运行时依赖（不含 dev 组、不含本包）交 pip-audit 审。
  # 跑 windows-latest 与本地核验环境一致（lock 是全平台通用锁，pywinpty/pywin32 等
  # Windows 专属依赖在别的平台装不出来）；不改 pyproject.toml / uv.lock，导出是纯读。
  audit:
    name: pip-audit (locked deps)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      # --no-emit-project：本包 skysheep-engine 不在 PyPI 上，带着 -e . 时
      # pip-audit --strict 必红（本地实测：skysheep-engine: Dependency not found on PyPI）
      - name: Export locked deps (runtime only)
        working-directory: engine
        run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements-audit.txt

      # --strict：任何已知漏洞照常红。CVE-2026-101918（pyjwt < 2.15.0，经 mcp 传入的
      # 传递依赖）在引入本 job 时锁文件里还没有修复版本，曾定点 ignore；
      # 已于 2026-10-01 升级到修复版 pyjwt 2.15.1（uv lock --upgrade-package pyjwt）解除。
      - name: pip-audit
        working-directory: engine
        run: uvx pip-audit -r requirements-audit.txt --strict
