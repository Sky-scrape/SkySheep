name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint & test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        working-directory: engine
        run: uv sync

      - name: Ruff check
        working-directory: engine
        run: uv run ruff check .

      - name: Pytest
        working-directory: engine
        run: uv run pytest -q
