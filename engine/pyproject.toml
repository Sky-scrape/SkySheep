[project]
name = "skysheep-engine"
version = "2.0"
description = "SkySheep engine — open-source AI agent workbench kernel (agent loop, tools, providers, permissions, sessions)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SkySheep contributors" }]
keywords = ["ai", "agent", "llm", "harness", "workbench"]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "aiosqlite>=0.20",
    "mcp>=2.2.0",
    "fastapi>=0.141.1",
    "websockets>=17.1",
    "pywebview>=6.2.1",
    "tomli-w>=1.2.0",
    "winotify>=1.1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.0",  # pypdf 初始化会探测 PIL；测试也用它构造样例图（截图功能已移除）
    "python-pptx>=1.0.2",
    "pywinpty>=3.0.5",
]

[project.scripts]
skysheep = "skysheep.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skysheep"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 测试分层：默认全跑；用 `-m "not e2e"` 跳过真实网络栈用例（需要本机端口），
# 用 `-m e2e` 只跑它们。slow 留给将来需要长时运行的用例。
markers = [
    "e2e: 起真实服务/真实 socket 的端到端用例（比进程内用例慢）",
    "slow: 耗时明显、不适合每次提交都跑的用例",
]
# 单用例超时保护：挂死的 async 用例（比如等一个永远不会来的事件）会拖死整个 CI。
# thread 法对不配合的 C 级等待也能强杀；120s 覆盖最慢的 e2e/覆盖率场景绰绰有余。
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
